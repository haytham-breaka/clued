# Keeps the pinned GitHub Actions and the dev-only test tools up to date, once a week.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    ignore:
      # Node's types follow the oldest Node clued supports (package.json engines), not the newest:
      # newer ones would let code use APIs that Node 22 doesn't have.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
