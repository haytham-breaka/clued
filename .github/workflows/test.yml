name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      # The end-to-end tests drive the app in tmux.
      - run: sudo apt-get update && sudo apt-get install -y tmux
      - run: npm ci
      - run: npm run typecheck
      - run: npm run coverage
        env:
          # A shared runner is slower than a laptop: give each wait in the end-to-end tests longer.
          E2E_WAIT_MS: '30000'
      - name: Coverage summary
        if: always() && hashFiles('coverage/coverage-summary.json') != ''
        run: |
          node -e '
            const s = require("./coverage/coverage-summary.json")
            const pct = m => `${m.pct}%`
            const rows = Object.entries(s).map(([f, m]) => `| ${f === "total" ? "**Total**" : f.replace(process.cwd() + "/", "")} | ${pct(m.lines)} | ${pct(m.branches)} | ${pct(m.functions)} |`)
            console.log(["## Coverage", "", "| File | Lines | Branches | Functions |", "|---|---|---|---|", ...rows].join("\n"))
          ' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && hashFiles('coverage/coverage-summary.json') != ''
        with:
          name: coverage-summary
          path: coverage/coverage-summary.json
