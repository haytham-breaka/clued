# The clued window: tmux with every bar and badge of its own hidden.
set -g status off
set -g mouse on
set -g escape-time 0
set -g focus-events on
# tmux-256color where this machine knows it; macOS's own terminfo doesn't, so there screen-256color.
if-shell "infocmp tmux-256color" "set -g default-terminal tmux-256color" "set -g default-terminal screen-256color"
set -as terminal-features ",*:RGB"
set -g allow-passthrough on
set -g history-limit 50000
set -g pane-border-lines single
set -g pane-border-style "fg=colour237"
set -g pane-active-border-style "fg=colour237"
set -g remain-on-exit off
